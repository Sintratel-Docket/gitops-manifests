apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Sintratel-Docket/gitops-manifests.git
    targetRevision: main
    path: dev/auth-api
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-auth-api
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
