apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: log-message-processor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Sintratel-Docket/gitops-manifests.git
    targetRevision: main
    path: dev/log-message-processor
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-log-message-processor
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
