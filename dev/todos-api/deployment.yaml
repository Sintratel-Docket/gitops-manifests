apiVersion: apps/v1
kind: Deployment
metadata:
  name: todos-api
  namespace: dev-todos-api
  labels:
    app: todos-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todos-api
  template:
    metadata:
      labels:
        app: todos-api
      annotations:
        gitops.sintratel.io/reconciliation-marker: baseline
    spec:
      containers:
        - name: todos-api
          # Replace with a real immutable CI-published tag before runtime deployment.
          image: 429418377318.dkr.ecr.us-east-1.amazonaws.com/docket/todos-api:__IMAGE_TAG_PENDING_CI__
          imagePullPolicy: IfNotPresent
          env:
            - name: TODO_API_PORT
              value: "8082"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: docket-jwt
                  key: jwt-secret
            - name: REDIS_HOST
              value: redis.dev-todos-api.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_CHANNEL
              value: log_channel
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
