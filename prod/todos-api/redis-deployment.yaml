apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: prod-todos-api
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      annotations:
        gitops.sintratel.io/reconciliation-marker: baseline
    spec:
      containers:
        - name: redis
          image: redis:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
