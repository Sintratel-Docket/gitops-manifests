apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-users-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Sintratel-Docket/gitops-manifests.git
    targetRevision: main
    path: prod/users-api
  destination:
    name: docket-prod
    namespace: prod-users-api
  # Producción: sync MANUAL (sin 'automated'). El despliegue a prod requiere
  # aprobacion por PR + un "Sync" explicito en Argo CD (promocion controlada, #9).
  syncPolicy: {}
