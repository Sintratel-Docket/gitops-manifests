apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Sintratel-Docket/gitops-manifests.git
    targetRevision: main
    path: prod/frontend
  destination:
    name: docket-prod
    namespace: prod-frontend
  # Producción: sync MANUAL (sin 'automated'). El despliegue a prod requiere
  # aprobacion por PR + un "Sync" explicito en Argo CD (promocion controlada, #9).
  syncPolicy: {}
